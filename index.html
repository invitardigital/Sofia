document.addEventListener("DOMContentLoaded", () => {
  const elementos = document.querySelectorAll(".observado");
  const animando = new Set();
  const yaAnimado = new WeakMap();
  const timeoutLimpieza = new WeakMap();

  elementos.forEach(el => {
    const anims = [...el.classList].filter(c =>
      c.startsWith("animate__") && c !== "animate__animated"
    );
    el.dataset.animations = anims.join(" ");
    el.classList.remove("animate__animated", ...anims);
  });

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const el = entry.target;
      const anims = el.dataset.animations.split(" ").filter(Boolean);
      const tieneControl = el.dataset.control === 'true';

      if (entry.isIntersecting) {
        if (animando.has(el) || yaAnimado.get(el) === 'animando') return;

        if (timeoutLimpieza.has(el)) {
          clearTimeout(timeoutLimpieza.get(el));
          timeoutLimpieza.delete(el);
        }

        animando.add(el);
        yaAnimado.set(el, 'animando');
        
        if (tieneControl) {
          el.style.opacity = '1';
          el.style.transform = 'none';
        }
        
        el.classList.add("animate__animated", ...anims);
        
        const limpiar = () => {
          if (timeoutLimpieza.has(el)) {
            clearTimeout(timeoutLimpieza.get(el));
            timeoutLimpieza.delete(el);
          }
          
          animando.delete(el);
          yaAnimado.set(el, false); // 🔥 false en vez de dejar 'animando'
          el.classList.remove("animate__animated", ...anims);
          
          if (tieneControl) {
            el.style.opacity = '0';
          } else {
            el.style.transform = 'none';
            el.style.opacity = '1';
          }
        };
        
        const timeout = setTimeout(() => limpiar(), 2500);
        timeoutLimpieza.set(el, timeout);
        
        el.addEventListener("animationend", () => limpiar(), { once: true });

      } else {
        if (animando.has(el)) return;
        
        yaAnimado.set(el, false);
        el.classList.remove("animate__animated", ...anims);
        
        if (tieneControl) {
          el.style.transform = 'none';
          el.style.opacity = '0';
        } else {
          el.style.transform = 'none';
          el.style.opacity = '1';
        }
      }
    });
  }, {
    threshold: 0.05,
    rootMargin: "50px"
  });

  elementos.forEach(el => observer.observe(el));
});

class UrlParams {  constructor() { this.params = new URLSearchParams(window.location.search); }  get(key) { return this.params.get(key); } }

            console.log(data.message);
        }
    }
    fetch(link)
    .then(response => response.text())
    .then(data => procesarRespuesta(data))
    .catch(error => {
        console.error('Error en la petición:', error);
        window.location.href = "./";
    });
  
}else{

function addinvitado(){
    const familia = document.getElementById('familia').value.trim().toLowerCase();
    const personas = document.getElementById('personas').value.trim();
    if (familia === '') {
        Toastify({
            text: "La familia no puede ser vacio",
            duration: 1000,
            backgroundColor: "#F44336"
        }).showToast();
        return false;
    }
    if (personas === '') {
        Toastify({
            text: "El número de personas no puede ser vacio",
            duration: 1000,
            backgroundColor: "#F44336"
        }).showToast();
        return false;
    }
    if (isNaN(personas) || personas <= 0) {
        Toastify({
            text: "El número de personas debe ser un número válido mayor a 0",
            duration: 1000,
            backgroundColor: "#F44336"
        }).showToast();
        return false;
    }
    const tabla = document.querySelector('table');
    const tbody = tabla.querySelector('tbody');
    let textoEncontrado = false;
    if (tbody.textContent.includes('Agrega invitados en la parte de abajo')) {
        textoEncontrado = true;
    }
    if (textoEncontrado) {
        tbody.innerHTML = ''; // Limpiar
    }
    let FEncontrado = false;
    if (tbody.textContent.includes(familia)) {
        FEncontrado = true;
    }
    if (FEncontrado) {
        Toastify({
            text: "La familia ya esta agregada",
            duration: 1000,
            backgroundColor: "#F44336"
        }).showToast();
        return false;
    }
    tbody.innerHTML += `
        <tr data-familia="${familia}">
            <td>${familia}</td>
            <td>${personas}</td>
            <td>❌ No</td>
            <td class="text_center">
                <button type="button" class="btn btn-primary p_5" onclick="compartirWat('${familia}')"><span class="material-icons">reply</span></button>
                <button type="button" class="btn btn-danger p_5" onclick="deleteFam('${familia}')"><span class="material-icons">delete</span></button>
            </td>
        </tr>
    `;
    Toastify({
        text: "Agregando ",
        duration: 1000,
        backgroundColor: "#4CAF50"
    }).showToast();
    document.getElementById('familia').value = '';
    document.getElementById('personas').value = '';
    var url = `${API}confirm_update?cliente_id=${CLIENTE_ID}&tipo=1&familia=${familia}&personas=${personas}&r=${Math.random()}`;
    function procesarRespuesta(data) {
        console.log('Invitado agregado exitosamente');
    }
    fetch(url)
        .then(response => response.text())
        .then(data => procesarRespuesta(data))
        .catch(error => {
            console.error('Error al agregar invitado:', error);
            Toastify({
                text: "Error al guardar en el servidor",
                duration: 1000,
                backgroundColor: "#F44336"
            }).showToast();
        });
}
function deleteFam(familia){
    document.querySelector('[data-familia="'+familia+'"]').remove();
    const tabla = document.querySelector('table');
    const tbody = tabla.querySelector('tbody');
    const totalTr = tbody.querySelectorAll('tr').length
    if(totalTr < 1){
        tbody.innerHTML += `
            <tr>
                <td class="text_center" colspan="4">Agrega invitados en la parte de abajo</td>
            </tr>
        `;
    }
    Toastify({
        text: "Borrado ",
        duration: 1000,
        backgroundColor: "#4CAF50"
    }).showToast();

    var url = `${API}confirm_update?cliente_id=${CLIENTE_ID}&tipo=0&familia=${familia}&r=${Math.random()}`;
    
    function procesarRespuesta(data) {

                duration: 1000,
                backgroundColor: "#F44336"

        });
}
function compartirWat(familia){
    const boton = document.createElement('button');
    boton.id = 'miBoton';
    boton.className = 'd_none';
    boton.textContent = 'Compartir WhatsApp';
    document.body.appendChild(boton);
    
    // Codificar la familia para evitar problemas con espacios
    const familiaCodeada = encodeURIComponent(familia);
    const mensaje = "https://invitardigital.github.io/Sofia/?invitado=" + familiaCodeada;
    const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensaje)}`;
    
    boton.addEventListener('click', function() {
        window.open(whatsappUrl, '_blank');
        boton.remove();
    });
    boton.click();
}
function toTitleCase(str) {
    return str
        .split(' ')
        .map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
        .join(' ');
}
function confirmarAsistencia() {
    if (invitadoId !== null) {
        fetch(`${API}confirm_confirm?id=${invitadoId}&r=${Math.random()}`)
            .then(response => response.text())
            .then(res => console.log('Confirmado:', res))
            .catch(error => console.error('Error al confirmar:', error));
    }
    window.open("https://api.whatsapp.com/send?phone=+5215656855722&text=Hola,%20confirmo%20mi%20asistencia%20a%20tu%20evento", '_blank');
}
